[package]
name = "debuginfo-census"
version = "0.1.0"
edition = "2024"
description = "Attribute the debug info in a Cargo target directory to the crate whose files hold it"

# Standalone: not part of the rust-lang/rust workspace.
[workspace]

[dependencies]
object = { version = "0.39", default-features = false, features = ["read", "std", "compression"] }
gimli = { version = "0.33", default-features = false, features = ["read", "std"] }
serde_json = "1"
