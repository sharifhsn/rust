change-id = "ignore"

[build]
build = "aarch64-unknown-linux-gnu"
host = ["aarch64-unknown-linux-gnu"]
target = ["aarch64-unknown-linux-gnu"]
build-dir = "/tmp/rust-compact-bootstrap"
jobs = 4
docs = false
extended = false

[llvm]
download-ci-llvm = true
assertions = false

[rust]
download-rustc = false
channel = "dev"
optimize = true
debug-assertions = false
debuginfo-level = 0
incremental = false
codegen-units = 16
lld = false
